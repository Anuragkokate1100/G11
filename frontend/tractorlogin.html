<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackBill AI - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page reference-login-page">
    <header class="auth-topbar">
        <a href="index.html" class="auth-logo"><span><i class="bi bi-truck-front-fill"></i></span><b>TrackBill <em>AI</em></b></a>
        <nav><a href="index.html">Home</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a><a class="auth-nav-login" href="tractorlogin.html">Login</a><a class="auth-nav-register" href="register.html">Register</a></nav>
    </header>

    <main class="reference-login-main">
        <section class="reference-login-card">
            <div class="reference-login-title">
                <h1>Welcome Back! <span>👋</span></h1>
                <p>Login to continue managing your tractor business</p>
            </div>

            <div class="login-divider"><span>LOGIN AS</span></div>
            <div class="role-grid">
                <button class="role-card selected" type="button" data-role="owner" aria-pressed="true"><i class="bi bi-truck-front-fill"></i><strong>Tractor Owner</strong><small>Manage your tractor<br>and billing</small><span class="role-check"><i class="bi bi-check-lg"></i></span></button>
                <button class="role-card" type="button" data-role="farmer" aria-pressed="false"><i class="bi bi-flower1"></i><strong>Farmer</strong><small>Book tractors and<br>manage farm work</small></button>
            </div>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>
            <form id="login-form">
                <div class="reference-field">
                    <label for="email">Email / Mobile Number</label>
                    <div class="reference-input"><i class="bi bi-person"></i><input type="email" id="email" placeholder="Enter email or mobile number" required></div>
                </div>
                <div class="reference-field">
                    <label for="password">Password</label>
                    <div class="reference-input"><i class="bi bi-lock"></i><input type="password" id="password" placeholder="Enter password" required><button type="button" id="toggle-password"><i class="bi bi-eye" id="toggle-icon"></i></button></div>
                </div>
                <div class="reference-login-options"><label><input type="checkbox" checked> <span>Remember Me</span></label><a href="#">Forgot Password?</a></div>
                <button type="submit" class="reference-login-button" id="btn-login"><span id="btn-text"><i class="bi bi-box-arrow-in-right"></i> Login</span><span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span></button>
                <a class="reference-register-button" id="register-link" href="register.html"><i class="bi bi-person-plus"></i> Create New Account</a>
                <button type="button" class="demo-link" id="btn-demo-fill"><i class="bi bi-lightning-charge"></i> Fill Demo Account</button>
            </form>

            <div class="reference-trust-row"><span><i class="bi bi-shield-check"></i> Secure</span><b>•</b><span><i class="bi bi-shield-check"></i> Reliable</span><b>•</b><span><i class="bi bi-cpu"></i> AI Powered</span></div>
            <div class="reference-powered">Powered by <strong>Google Gemini AI</strong></div>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
