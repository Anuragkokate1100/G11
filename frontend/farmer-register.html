<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmer Registration | TrackBill AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>body{background:#f2f7ef}.farmer-register{max-width:760px;margin:38px auto;background:white;border-radius:20px;padding:28px;box-shadow:0 12px 40px #183a1c18}.brand{color:#23753b;font-weight:800}.form-label{font-weight:600}</style></head><body><main class="container"><div class="farmer-register"><a href="index.html" class="brand text-decoration-none">🌱 TrackBill AI</a><h1 class="h3 mt-3">Farmer Registration</h1><p class="text-secondary">Create your farmer account to manage crops and farm details.</p><div id="message" class="alert d-none"></div><form id="farmer-register-form" class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input name="name" class="form-control" required maxlength="100"></div><div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required maxlength="100"></div><div class="col-md-6"><label class="form-label">Mobile number</label><input name="phone" type="tel" class="form-control" required minlength="10" maxlength="20"></div><div class="col-md-6"><label class="form-label">Password (min 8 characters)</label><input name="password" type="password" class="form-control" required minlength="8" maxlength="72"></div><div class="col-md-6"><label class="form-label">Village</label><input name="village" class="form-control" required></div><div class="col-md-6"><label class="form-label">Taluka</label><input name="taluka" class="form-control" required></div><div class="col-md-6"><label class="form-label">District</label><input name="district" class="form-control" required></div><div class="col-md-6"><label class="form-label">State</label><input name="state" class="form-control" value="Maharashtra" required></div><div class="col-md-6"><label class="form-label">Pincode</label><input name="pincode" class="form-control" pattern="[0-9]{6}" maxlength="6"></div><div class="col-12"><button id="submit-btn" class="btn btn-success w-100" type="submit">Create Farmer Account</button></div></form><p class="mt-3 mb-0">Already registered? <a href="tractorlogin.html">Login</a></p></div></main><script src="js/api.js"></script><script src="js/farmer-register.js"></script></body></html>
